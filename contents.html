<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellyfin Contents</title>
    <link rel="stylesheet" href="styles.css?v=installable-app-20261012">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#111720">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <main class="container contents-page">
        <header class="library-heading">
            <div class="library-brand">
                <a class="brand-home" href="index.html?manual=1" aria-label="Return to sign in">
                    <img src="App_icon.png" alt="">
                </a>
                <div>
                    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
                    <h1 id="contents-title">Contents</h1>
                    <p id="library-file-count" class="library-file-count" hidden></p>
                </div>
            </div>
            <button id="back-button" class="secondary-button" type="button" title="Back">Back</button>
        </header>
        <div id="contents-sort-controls" class="contents-sort-controls" role="group" aria-label="Sort films and folders">
            <label for="contents-sort-by">Sort by</label>
            <select id="contents-sort-by">
                <option value="SortName">Name</option>
                <option value="DateCreated">File date</option>
            </select>
            <button id="contents-sort-order" class="secondary-button sort-order-button" type="button" aria-label="Sort ascending" title="Sort ascending">Ascending</button>
        </div>
        <p id="contents-status" class="status" role="status" aria-live="polite"></p>
        <ul id="contents-list" class="item-list" aria-label="Folder contents"></ul>
        <button id="load-more" class="secondary-button load-more-button" type="button" hidden>Load more</button>
        <section id="player-section" class="player-section" hidden>
            <div id="player-stage" class="player-stage">
                <div class="player-heading">
                    <h2 id="player-title"></h2>
                    <google-cast-launcher id="cast-launcher" class="cast-launcher" aria-label="Cast to TV" title="Cast to TV" hidden></google-cast-launcher>
                </div>
                <video id="media-player" playsinline x-webkit-airplay="allow"></video>
                <div id="playback-controls" class="playback-controls" role="group" aria-label="Tap playback controls">
                    <button class="playback-button playback-seek playback-seek-long" type="button" data-seek="-60" aria-label="Back 60 seconds" title="Back 60 seconds">−60</button>
                    <button class="playback-button playback-seek" type="button" data-seek="-15" aria-label="Back 15 seconds" title="Back 15 seconds">−15</button>
                    <button id="playback-toggle" class="playback-button playback-toggle" type="button" aria-label="Pause" title="Pause"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
                    <button class="playback-button playback-seek" type="button" data-seek="15" aria-label="Forward 15 seconds" title="Forward 15 seconds">+15</button>
                    <button class="playback-button playback-seek playback-seek-long" type="button" data-seek="60" aria-label="Forward 60 seconds" title="Forward 60 seconds">+60</button>
                </div>
                <div id="playback-toolbar" class="playback-toolbar" role="group" aria-label="Playback toolbar">
                    <button id="close-player" class="toolbar-button" type="button" aria-label="Back to contents" title="Back to contents"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
                    <button class="toolbar-button toolbar-seek-long" type="button" data-seek="-60" aria-label="Back 60 seconds" title="Back 60 seconds">−60</button>
                    <button class="toolbar-button" type="button" data-seek="-15" aria-label="Back 15 seconds" title="Back 15 seconds">−15</button>
                    <button id="toolbar-playback-toggle" class="toolbar-button toolbar-playback-toggle" type="button" aria-label="Pause" title="Pause"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
                    <button class="toolbar-button" type="button" data-seek="15" aria-label="Forward 15 seconds" title="Forward 15 seconds">+15</button>
                    <button class="toolbar-button toolbar-seek-long" type="button" data-seek="60" aria-label="Forward 60 seconds" title="Forward 60 seconds">+60</button>
                    <div class="playback-timeline">
                        <span id="playback-current-time" class="playback-time">0:00</span>
                        <input id="playback-seekbar" class="playback-seekbar" type="range" min="0" max="1000" value="0" aria-label="Film position">
                        <span id="playback-duration" class="playback-time">0:00</span>
                    </div>
                    <div class="toolbar-action-group">
                        <div class="toolbar-track-control">
                            <button id="audio-track-button" class="toolbar-button toolbar-track-trigger" type="button" aria-label="Choose audio track" title="Choose audio track" aria-haspopup="listbox" aria-expanded="false" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></button>
                            <div id="audio-track-menu" class="toolbar-track-popup" role="listbox" aria-label="Audio tracks" hidden></div>
                            <select id="audio-stream-select" aria-label="Audio stream" hidden disabled>
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div class="toolbar-track-control">
                            <button id="subtitle-track-button" class="toolbar-button toolbar-track-trigger" type="button" aria-label="Choose subtitle track" title="Choose subtitle track" aria-haspopup="listbox" aria-expanded="false" disabled>CC</button>
                            <div id="subtitle-track-menu" class="toolbar-track-popup" role="listbox" aria-label="Subtitle tracks" hidden></div>
                            <select id="subtitle-stream-select" aria-label="Subtitle track" hidden disabled>
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <button id="fullscreen-like-button" class="like-button" type="button" aria-label="Like this film" aria-pressed="false" title="Like this film" hidden>♡</button>
                        <button id="delete-media-button" class="toolbar-button toolbar-delete" type="button" aria-label="Delete this film from the server" title="Delete this film from the server"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
                    </div>
                </div>
            </div>
        </section>
        <button id="bottom-back-button" class="secondary-button bottom-back-button" type="button" title="Back">Back</button>
    </main>
    <script src="vendor/hls-1.7.3.min.js"></script>
    <script src="contents.js?v=installable-app-20261012"></script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
