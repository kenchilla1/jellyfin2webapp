<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Jellyfin Viewer</title>

<body>

            <p class="subtitle">Connect to your server</p>

        <form id="auth-form">

            <select id="jellyfin-server" required>

                <option value="porn" selected>porn</option>
